<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zp-replay mapa 3D</title>
  <style>
    :root { --bg: #f5f5f4; --fg: #1c1917; --muted: #78716c; --accent: #b45309; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #fbbf24; }
    }
    :root[data-theme="dark"] { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #fbbf24; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    button, select { font: inherit; padding: 6px 10px; }
    #status { color: var(--muted); margin: 6px 0; min-height: 1.2em; }
    #view { width: 100%; max-width: 900px; aspect-ratio: 4 / 3; border: 1px solid var(--muted); }
    #view canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h1>de_dust2: mapa e visão em primeira pessoa</h1>
  <div class="bar">
    <button id="mode-overview" type="button">Visão geral</button>
    <button id="mode-orbit" type="button">3D livre</button>
    <button id="mode-first" type="button">1ª pessoa</button>
    <button id="mode-pov" type="button" disabled>Visão da demo</button>
    <select id="spawn" aria-label="Spawn"></select>
  </div>
  <div class="bar">
    <button id="play" type="button" disabled>Tocar</button>
    <input id="time" type="range" min="0" max="0" value="0" step="0.1" disabled aria-label="Tempo">
    <span id="clock"></span>
  </div>
  <div id="status">Carregando mapa...</div>
  <div id="view"></div>
  <script type="module" src="map-app.js"></script>
</body>
</html>
